# Local-only stack (system design §8, folding in the reliability review's
# `migrate` service and split health checks). Every published port is bound
# to 127.0.0.1; `db` is not published at all. `web` bind-mounts the repo
# root and expects a `web/` directory with its own package.json -- that
# lands in a separate PR (see docs/design/system-design.md §2, "Shared
# package"). Until both merge, `docker compose up web` fails at `cd web`
# with no such file or directory; `docker compose up -d db api worker` does
# not need it.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-stockticker}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-stockticker}'
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: runs `alembic upgrade head` and exits 0. `api`/`worker` wait
  # for it (service_completed_successfully) instead of either of them
  # running migrations themselves -- so a `--reload` restart of `api` never
  # re-runs a migration, and `worker` no longer needs `api` healthy first.
  migrate:
    build:
      context: ./api
    command: uv run --no-sync alembic upgrade head
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:-stockticker}
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      POSTGRES_APP_WRITER_PASSWORD: ${POSTGRES_APP_WRITER_PASSWORD:?}
      POSTGRES_AI_READER_PASSWORD: ${POSTGRES_AI_READER_PASSWORD:?}
    volumes:
      - ./api:/app
      - api_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ./api
    command: uv run --no-sync uvicorn stockticker.api.app:app --host 0.0.0.0 --port 8000 --reload --reload-dir src
    environment:
      ENVIRONMENT: development
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:-stockticker}
      POSTGRES_APP_WRITER_PASSWORD: ${POSTGRES_APP_WRITER_PASSWORD:?}
      POSTGRES_AI_READER_PASSWORD: ${POSTGRES_AI_READER_PASSWORD:?}
      ALPACA_KEY_ID: ${ALPACA_KEY_ID:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
      AI_DAILY_TOKEN_BUDGET: ${AI_DAILY_TOKEN_BUDGET:-2000000}
      AI_SPEND_LIMIT_USD: ${AI_SPEND_LIMIT_USD:-5.00}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["127.0.0.1","localhost"]}
    volumes:
      - ./api:/app
      - api_venv:/app/.venv
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ./api
    # watchfiles restarts the worker on any change under src/, the same way
    # --reload does for api (uvicorn owns its own reload; the worker has no
    # framework doing this for it).
    command: uv run --no-sync watchfiles "python -m stockticker.worker" src
    environment:
      ENVIRONMENT: development
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:-stockticker}
      POSTGRES_APP_WRITER_PASSWORD: ${POSTGRES_APP_WRITER_PASSWORD:?}
      ALPACA_KEY_ID: ${ALPACA_KEY_ID:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
    volumes:
      - ./api:/app
      - api_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The scheduler touches /tmp/worker-heartbeat every 15s; unhealthy if
      # it's gone stale (>60s), which catches a wedged event loop that a
      # plain "is the process alive" check would miss.
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import sys,time,os; p='/tmp/worker-heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<60 else 1)"
        ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  web:
    image: node:22-slim
    working_dir: /app/web
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter web dev -H 0.0.0.0 -p 3000"
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://127.0.0.1:8000}
      PUBLIC_WEB_HOST: ${PUBLIC_WEB_HOST:-}
      SHARE_PASSWORD: ${SHARE_PASSWORD:-}
    volumes:
      - .:/app
      # Two named volumes, not one (see AGENTS.md, "Compose"): a single
      # shared volume lets the workspace's hoisted root node_modules and
      # web/node_modules collide, and native binaries built on a macOS
      # host end up in a Linux container.
      - web_node_modules_root:/app/node_modules
      - web_node_modules:/app/web/node_modules
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  db_data:
  api_venv:
  web_node_modules_root:
  web_node_modules:
