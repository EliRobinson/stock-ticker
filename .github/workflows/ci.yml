# GitHub Actions checks are disabled here: the local hooks are the gate
# (.husky/pre-commit runs lint-staged; .husky/pre-push runs type-check, lint,
# format:check, test, build, and optionally E2E via RUN_E2E=1).
#
# The automatic triggers are off too, so nothing runs on push or PR. This
# matches the other repos, where GitHub Actions billing stopped jobs from
# starting. To restore CI: uncomment the triggers below and the
# quality/unit/e2e jobs.
name: CI

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks-notice:
    name: Checks run in git hooks
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: 'echo "Checks run locally in git hooks: see .husky/pre-commit and .husky/pre-push"'

