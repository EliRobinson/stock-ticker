[project]
name = "stockticker"
version = "0.1.0"
description = "Stock Ticker API and ingest worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anyio>=4.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "tenacity>=9.0",
    "apscheduler>=3.10,<4.0",
    "structlog>=24.4",
    "sqlglot>=25.0",
    "anthropic>=0.39",
    "selectolax>=0.4.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.28.1",
    "pyyaml>=6.0",
]

[project.scripts]
stockticker-api = "stockticker.__main__:run_api"
stockticker-worker = "stockticker.__main__:run_worker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockticker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `tests/edgar_support.py` is shared by unit + integration; `tests/unit`
# holds top-level helpers (`ai_fakes`, `provider_bars`). Neither directory
# has an __init__.py, so both must be on pythonpath — not via a shared
# `tests/conftest.py`, which would collide with mypy's top-level module rules.
pythonpath = ["tests", "tests/unit"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/Path()/Body() in a default argument is the
# framework's own idiom, not the mutable-default footgun B008 exists for.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
